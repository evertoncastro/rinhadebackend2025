version: '3.8'

services:
  
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "50mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    networks:
      - rinha-network
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "50MB"

  api-1:
    build: .
    environment:
      - PROCESSOR_DEFAULT_URL=http://payment-processor-default:8080
      - PROCESSOR_FALLBACK_URL=http://payment-processor-fallback:8080
      - REDIS_URL=redis://redis:6379/0
      - PAYMENTS_STREAM_MAXLEN=0
      - EMBED_WORKER=true
      - WORKER_READ_COUNT=64
      - WORKER_READ_BLOCK_MS=2000
      - WORKER_CONCURRENCY=48
      - WORKER_CONSUMER_NAME=api-1
    depends_on:
      redis:
        condition: service_started
    networks:
      - rinha-network
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.65"
          memory: "140MB"

  api-2:
    build: .
    environment:
      - PROCESSOR_DEFAULT_URL=http://payment-processor-default:8080
      - PROCESSOR_FALLBACK_URL=http://payment-processor-fallback:8080
      - REDIS_URL=redis://redis:6379/0
      - PAYMENTS_STREAM_MAXLEN=0
      - EMBED_WORKER=true
      - WORKER_READ_COUNT=64
      - WORKER_READ_BLOCK_MS=2000
      - WORKER_CONCURRENCY=48
      - WORKER_CONSUMER_NAME=api-2
    depends_on:
      redis:
        condition: service_started
    networks:
      - rinha-network
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.65"
          memory: "140MB"

  nginx:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    networks:
      - rinha-network
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20MB"

networks:
  rinha-network:
    name: rinha-network
    driver: bridge
  payment-processor:
    name: payment-processor
    external: true

